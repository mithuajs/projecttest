<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grocery Billing System</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@media print {
  body {
    background: white;
  }

  .no-print {
    display: none !important;
  }

  table {
    width: 100%;
  }
}
</style>
</head>

<body class="bg-gray-100 grid grid-cols-1 min-h-screen">

<div class="max-w-3xl mx-auto p-4">

  <h1 class="text-2xl font-bold text-center text-green-600 mb-5">
    Grocery Shop Billing System
  </h1>

  <!-- INPUT SECTION -->
  <div class="no-print bg-white p-4 rounded shadow space-y-3">

    <input id="product" type="text" placeholder="Product Name"
      class="w-full border p-2 rounded">

    <input id="qty" type="number" placeholder="Quantity"
      class="w-full border p-2 rounded">

    <input id="price" type="number" placeholder="Price"
      class="w-full border p-2 rounded">

    <button onclick="addProduct()"
      class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">
      Add Product
    </button>

  </div>

  <!-- TABLE -->
  <div class="bg-white mt-5 p-4 rounded shadow">

    <table class="w-full text-center border">

      <thead class="bg-gray-200">
        <tr>
          <th class="p-2">Product</th>
          <th class="p-2">Qty</th>
          <th class="p-2">Price</th>
          <th class="p-2">Total</th>
          <th class="p-2 no-print">Action</th>
        </tr>
      </thead>

      <tbody id="list"></tbody>
    </table>

    <h2 class="text-right mt-4 font-bold">
      Grand Total: <span id="grandTotal">0</span> BDT
    </h2>

  </div>

  <!-- PRINT BUTTON -->
  <button onclick="printBill()"
    class="no-print w-full mt-4 bg-blue-500 text-white p-2 rounded hover:bg-blue-600">
    Print Bill
  </button>

</div>

<script src="./script/active.js"></script>

</body>
</html>
